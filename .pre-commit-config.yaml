# Pre-commit configuration for Firefly Mini (Feature 112)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.7.0
          - types-PyYAML
          - types-psutil
        args: ["--ignore-missing-imports"]

  - repo: local
    hooks:
      - id: firefly-secret-scan
        name: Firefly Secret & Credential Redaction Scan
        entry: python -c "import sys, re; pat = re.compile(r'(?i)(?:api_key|secret_key|private_key|token)\s*=\s*[\'\"][^\'\"]+[\'\"]'); sys.exit(1 if any(pat.search(open(f, errors='ignore').read()) for f in sys.argv[1:]) else 0)"
        language: system
        types: [python, yaml, json]
