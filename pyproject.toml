[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firefly-mini"
version = "2.1.0"
description = "Autonomous Cyber-Cat Desktop Assistant & Terminal Defense Agent for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Firefly Team" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "psutil>=5.9.8",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "Pillow>=10.2.0",
    "pydantic>=2.7.0",
    "pyotp>=2.9.0",
    "pyautogui>=0.9.54",
    "mss>=9.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
firefly = "firefly.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "unit: Fast isolated unit tests",
    "integration: Multi-component integration tests",
    "adversarial: Red-team and security evasion tests",
    "slow: Long-running or heavy tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
mypy_path = "src"

